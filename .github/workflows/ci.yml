name: CI and deployment
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.401'}
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build --no-restore -c Release
  release:
    needs: test
    if: github.event_name == 'push' && !github.event.repository.is_template
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/release.yml@14831eac536f36bbf82baa1394f2c59aa0423f28
    with:
      platform-sha: 14831eac536f36bbf82baa1394f2c59aa0423f28
    secrets:
      PAAS_SECRETS: ${{ secrets.PAAS_SECRETS }}
